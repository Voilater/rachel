# Simulate Lightsail $7 (1 GB total) for app + MySQL.
# OS on a real VPS also needs ~200–300 MB — this stack is capped at ~768 MB.
services:
  mysql:
    image: mysql:8.0
    container_name: rp-mysql-1g
    restart: "no"
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vk_studio
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    command:
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --table-open-cache=64
      - --max-connections=50
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "3308:3306"

  app:
    build: .
    container_name: rp-app-1g
    restart: "no"
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      NODE_OPTIONS: --max-old-space-size=192
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USER: admin
      DATABASE_PASSWORD: admin
      DATABASE_NAME: vk_studio
      APP_BASE_URL: http://localhost:3001
      AUTH_TRUST_HOST: "true"
    env_file:
      - .env
