# Low-memory production stack for Lightsail ~1–2 GB.
# App image is loaded/built separately; set ECR_IMAGE.

name: rachelparadise

services:
  mysql:
    image: mysql:8.0
    container_name: rachelparadise-mysql
    restart: unless-stopped
    mem_limit: 512m
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:?Set DATABASE_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME:?Set DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER:?Set DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    command:
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --table-open-cache=64
      - --max-connections=50
    # MySQL stays on the Docker network only (not public).
    expose:
      - "3306"
    volumes:
      - rachelparadise_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${DATABASE_ROOT_PASSWORD:?Set DATABASE_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    image: ${ECR_IMAGE:?Set ECR_IMAGE}
    container_name: rachelparadise-app
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      NODE_OPTIONS: --max-old-space-size=192
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USER: ${DATABASE_USER:?Set DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME:?Set DATABASE_NAME}
      APP_BASE_URL: https://rachelparadise.in
      AUTH_URL: https://rachelparadise.in/api/auth
      AUTH_TRUST_HOST: "true"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  rachelparadise_mysql_data:
    name: rachelparadise_mysql_data
