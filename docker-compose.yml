version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: vk-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: vk_root
      MYSQL_DATABASE: vk_studio
      MYSQL_USER: vk_app
      MYSQL_PASSWORD: vk_app_pass
    ports:
      - "3306:3306"
    volumes:
      - vk_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pvk_root"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vk_mysql_data:
