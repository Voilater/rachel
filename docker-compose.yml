# Local development uses Homebrew MySQL on the host (see .env).
# This file only runs the app container against host MySQL if needed.
# Prefer: npm run dev (no Docker).

services:
  app:
    build: .
    container_name: vk-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_HOST: host.docker.internal
      DATABASE_PORT: 3306
      DATABASE_USER: admin
      DATABASE_PASSWORD: admin
      DATABASE_NAME: vk_studio
      APP_BASE_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
    env_file:
      - .env
