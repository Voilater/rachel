version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: vk-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: vk_root
      MYSQL_DATABASE: vk_studio
      MYSQL_USER: vk_app
      MYSQL_PASSWORD: vk_app_pass
    ports:
      - "3306:3306"
    volumes:
      - vk_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pvk_root"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: vk-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USER: vk_app
      DATABASE_PASSWORD: vk_app_pass
      DATABASE_NAME: vk_studio
      APP_BASE_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      # Copy from .env or set here for production:
      # RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET
      # AUTH0_DOMAIN, AUTH0_CLIENT_ID, AUTH0_CLIENT_SECRET, AUTH0_SECRET
      # ADMIN_EMAIL, ADMIN_PASSWORD
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  vk_mysql_data:
